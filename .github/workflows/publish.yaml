name: Publish Templates to S3

on:
  push:
    branches:
      - main
    paths:
      - 'v1/**'
  workflow_dispatch: {}

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish v1 templates
    runs-on: ubuntu-latest
    # workflow_dispatch has no branches: filter (unlike push) — guard explicitly so a manual run against any other ref fails fast instead of relying solely on the OIDC trust's ref check.
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: arn:aws:iam::861276082564:role/prod-github-actions-integration-templates-publish
          aws-region: us-east-1

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync v1/ s3://surfai-integration-templates/v1/ \
            --content-type "application/x-yaml" \
            --exclude "*" --include "*.yaml"
          echo "Published s3://surfai-integration-templates/v1/" >> "$GITHUB_STEP_SUMMARY"
