AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Creates the cross-account IAM role that Surf AI assumes for read-only visibility into this AWS account, and optionally enables S3 request metrics on your S3 buckets.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Surf AI connection
        Parameters:
          - ExternalId
          - IfRoleAlreadyExists
      - Label:
          default: S3 request activity analysis (optional)
        Parameters:
          - EnableS3RequestMetrics
          - AutoEnableNewBuckets
    ParameterLabels:
      ExternalId:
        default: External ID (provided by Surf AI)
      IfRoleAlreadyExists:
        default: Create the role, or use one you already created?
      EnableS3RequestMetrics:
        default: Enable S3 request metrics on existing buckets?
      AutoEnableNewBuckets:
        default: Keep enabling request metrics on buckets created in the future?

Parameters:
  ExternalId:
    Type: String
    Description: Unique External ID provided by Surf AI for this account.
    NoEcho: true
    MinLength: 20
    MaxLength: 1224
    AllowedPattern: "^[\\w+=,.@:/-]+$"
  IfRoleAlreadyExists:
    Type: String
    Description: >-
      Leave "create" (default) to have this stack create the role. Stack
      creation stops with an error if a role named
      "surfai-integration-role" already exists, rather than modifying it.
      Choose "use-existing" if you created the role yourself: the stack
      leaves it alone and verifies that its trust policy and permissions
      match what Surf AI requires, reporting a specific reason if they do
      not. To replace a role that does not pass verification, delete it in
      the IAM console and deploy again with "create".
    Default: "create"
    AllowedValues: ["create", "use-existing"]
  EnableS3RequestMetrics:
    Type: String
    Description: >-
      Optional. Set to "true" to enable S3 request metrics (filter name
      "EntireBucket") on all S3 buckets that currently exist in this account,
      allowing Surf AI to analyze S3 request activity. Buckets that already
      have an "EntireBucket" filter are left untouched. S3 request metrics
      may incur additional CloudWatch costs, about $4.80 per month for each
      bucket that receives requests. See the README for how that is
      calculated.
    Default: "true"
    AllowedValues: ["true", "false"]
  AutoEnableNewBuckets:
    Type: String
    Description: >-
      Only applies when the previous option is "true"; otherwise ignored.
      Keeps S3 request metrics enabled on buckets created in the future, by
      installing a small maintenance task in this account (a Lambda function
      triggered once per day) that enables the "EntireBucket" filter on any
      bucket that does not have one yet. Set to "false" to enable metrics
      only once, on the buckets that exist today.
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  CreateRole: !Equals [!Ref IfRoleAlreadyExists, "create"]
  UseExistingRole: !Equals [!Ref IfRoleAlreadyExists, "use-existing"]
  S3RequestMetricsEnabled: !Equals [!Ref EnableS3RequestMetrics, "true"]
  DailySweepEnabled: !And
    - !Condition S3RequestMetricsEnabled
    - !Equals [!Ref AutoEnableNewBuckets, "true"]

Resources:
  SurfAiIntegrationRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      RoleName: surfai-integration-role
      Description: Role assumed by Surf AI for security analysis and product features. Access is limited to the read-only actions enumerated in the SurfAiIntegrationReadOnly policy below.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Principal is account root, scoped via aws:PrincipalArn below, not a role ARN - see README for why.
          - Sid: AllowSurfAIAssumeRole
            Effect: Allow
            Principal:
              AWS: "arn:aws:iam::861276082564:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
              ArnEquals:
                "aws:PrincipalArn": "arn:aws:iam::861276082564:role/surfai/integration/surfai-customer-integration"
          - Sid: AllowSurfAITagSession
            Effect: Allow
            Principal:
              AWS: "arn:aws:iam::861276082564:root"
            Action: "sts:TagSession"
            Condition:
              ArnEquals:
                "aws:PrincipalArn": "arn:aws:iam::861276082564:role/surfai/integration/surfai-customer-integration"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/SecurityAudit"
      Policies:
        - PolicyName: SurfAiIntegrationReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudTrailReadOnly
                Effect: Allow
                Action: "cloudtrail:LookupEvents"
                Resource: "*"
              - Sid: CloudWatchMetricsReadOnly
                Effect: Allow
                Action:
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:ListMetrics"
                Resource: "*"
              - Sid: EC2ReadOnly
                Effect: Allow
                Action:
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeClientVpnEndpoints"
                Resource: "*"
              - Sid: IAMReadOnly
                Effect: Allow
                Action:
                  - "iam:ListGroups"
                  - "iam:ListPolicies"
                  - "iam:GetPolicy"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:ListRoles"
                  - "iam:ListUsers"
                Resource: "*"
              - Sid: ACMReadOnly
                Effect: Allow
                Action:
                  - "acm:ListCertificates"
                  - "acm:DescribeCertificate"
                  - "acm:ListTagsForCertificate"
                Resource: "*"
              - Sid: RDSReadOnly
                Effect: Allow
                Action: "rds:DescribeDBInstances"
                Resource: "*"
              - Sid: S3ReadOnly
                Effect: Allow
                Action: "s3:ListAllMyBuckets"
                Resource: "*"
              - Sid: ResourceGroupsTaggingReadOnly
                Effect: Allow
                Action: "tag:GetResources"
                Resource: "*"
              - Sid: ResourceGroupsReadOnly
                Effect: Allow
                Action: "resource-groups:ListGroups"
                Resource: "*"
              - Sid: IdentityStoreReadOnly
                Effect: Allow
                Action:
                  - "identitystore:ListGroups"
                  - "identitystore:ListGroupMemberships"
                  - "identitystore:ListUsers"
                Resource: "*"
              - Sid: SSOAdminReadOnly
                Effect: Allow
                Action: "sso:ListInstances"
                Resource: "*"
              - Sid: OrganizationsReadOnly
                Effect: Allow
                Action:
                  - "organizations:ListAccounts"
                  - "organizations:DescribeOrganization"
                Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: surfai-integration
        - Key: Purpose
          Value: surf-ai-readonly-access

  ExistingRoleValidationFunctionRole:
    Type: AWS::IAM::Role
    Condition: UseExistingRole
    Properties:
      Description: Read-only execution role for the Lambda that validates the existing integration role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: ValidateIntegrationRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "iam:GetRole"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:ListRolePolicies"
                  - "iam:GetRolePolicy"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/surfai-integration-role"
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action: "cloudformation:ListStackResources"
                Resource: !Ref AWS::StackId
      Tags:
        - Key: ManagedBy
          Value: surfai-integration

  ExistingRoleValidationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UseExistingRole
    Properties:
      # Custom name: the Lambda-default has no retention and fails "already exists" on redeploy.
      LogGroupName: !Sub "/surfai/integration/${AWS::StackName}-role-validation"
      RetentionInDays: 30

  ExistingRoleValidationFunction:
    Type: AWS::Lambda::Function
    Condition: UseExistingRole
    Properties:
      Description: Verifies the pre-existing surfai-integration-role matches Surf AI requirements. Read-only.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt ExistingRoleValidationFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref ExistingRoleValidationLogGroup
      Code:
        ZipFile: |
          import boto3, json, time, urllib.request
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          class ResponseDeliveryError(Exception):
              """Delivery failure, not a validation result - must not be caught as generic Exception."""

          ROLE = "surfai-integration-role"
          # Accepts the bridge role's ARN (older shape) or account root (current shape).
          TRUSTED_PRINCIPALS = {
              "arn:aws:iam::861276082564:role/surfai/integration/surfai-customer-integration",
              "arn:aws:iam::861276082564:root",
          }
          TRUSTED_ACTIONS = {"sts:AssumeRole", "sts:TagSession"}

          def statement_principals(st):
              # Returns principal strings, or None for any shape we don't recognize.
              principal = st.get("Principal", {})
              if isinstance(principal, dict):
                  if set(principal) - {"AWS"}:
                      return None
                  pr = principal.get("AWS")
                  if pr is None:
                      return None
                  return pr if isinstance(pr, list) else [pr]
              if isinstance(principal, str):
                  return [principal]
              return None

          def action_map(doc):
              out = {}
              stmts = doc.get("Statement", [])
              if isinstance(stmts, dict):
                  stmts = [stmts]
              for st in stmts:
                  acts = st.get("Action", [])
                  acts = acts if isinstance(acts, list) else [acts]
                  for a in acts:
                      if isinstance(a, str):
                          out[a.lower()] = a
              return out

          def granted_actions(doc, label, problems):
              actions = set()
              stmts = doc.get("Statement", [])
              if isinstance(stmts, dict):
                  stmts = [stmts]
              for st in stmts:
                  if not isinstance(st, dict):
                      problems.append(f"{label} contains a malformed statement")
                      return None
                  if "NotAction" in st or "NotResource" in st:
                      problems.append(f"{label} uses NotAction or NotResource, which Surf AI's check cannot evaluate - "
                                      "rewrite it with an explicit Action list")
                      return None
                  if st.get("Effect") == "Deny":
                      problems.append(f"{label} contains a Deny statement, which can remove access Surf AI needs "
                                      "without this check being able to tell - remove it")
                      return None
                  if st.get("Effect") != "Allow":
                      problems.append(f"{label} contains a statement whose Effect is neither Allow nor Deny")
                      return None
                  if st.get("Resource") != "*":
                      problems.append(f"{label} has an Allow statement scoped to a Resource other than \"*\", "
                                      "so the actions it appears to grant may not be usable")
                      return None
                  if st.get("Condition"):
                      problems.append(f"{label} has an Allow statement carrying a Condition, "
                                      "so the actions it appears to grant may never be usable")
                      return None
                  acts = st.get("Action", [])
                  acts = acts if isinstance(acts, list) else [acts]
                  for a in acts:
                      if not isinstance(a, str):
                          problems.append(f"{label} contains a non-string Action entry")
                          return None
                      if "*" in a or "?" in a:
                          problems.append(f"{label} grants \"{a}\", a wildcard. Surf AI's role must list actions "
                                          "explicitly so its permissions are exactly what the template documents")
                          return None
                      actions.add(a.lower())
              return actions

          def send(event, status, reason):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason[:3800],
                  "PhysicalResourceId": "surfai-existing-role-validation",
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }).encode()
              last_error = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          event["ResponseURL"], data=body, method="PUT",
                          headers={"Content-Type": ""})
                      urllib.request.urlopen(req, timeout=3)
                      return
                  except Exception as e:
                      last_error = e
                      if attempt < 2:
                          time.sleep(2 ** attempt)
              # Distinguishable type so it isn't mistaken for a real FAILED validation result.
              print(f"failed to deliver CloudFormation response after 3 attempts: {last_error}")
              raise ResponseDeliveryError(last_error)

          def stack_already_creates_role(event):
              """True when this same stack still manages the role - adopting it would delete it."""
              # Bounded so a hung control plane still leaves the function time to answer CloudFormation.
              cfn = boto3.client("cloudformation", config=Config(
                  connect_timeout=5, read_timeout=8, retries={"max_attempts": 1}))
              stack_id, last_error = event["StackId"], None
              for attempt in range(3):
                  try:
                      pages = cfn.get_paginator("list_stack_resources").paginate(StackName=stack_id)
                      # Matched on physical ID so renaming the role's logical ID cannot silently disable this.
                      return any(r["ResourceType"] == "AWS::IAM::Role"
                                 and r.get("PhysicalResourceId") == ROLE
                                 for page in pages for r in page["StackResourceSummaries"])
                  except (BotoCoreError, ClientError) as e:
                      last_error = e
                      if attempt < 2:
                          time.sleep(2 ** attempt)
              raise Exception(
                  f"could not check whether this stack already manages {ROLE}, so it was not "
                  f"adopted - retry once the error below clears: {last_error}")

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      send(event, "SUCCESS", "no-op")
                      return
                  if stack_already_creates_role(event):
                      send(event, "FAILED",
                           f"this stack created {ROLE} itself, so it cannot also adopt it - "
                           "switching to 'use-existing' would delete the role, so the update "
                           "was refused and the role is unchanged. See the repository README "
                           "if you need the role managed outside this stack.")
                      return
                  expected_eid = event["ResourceProperties"]["ExternalId"]
                  required_display = action_map(event["ResourceProperties"]["RequiredPolicyDocument"])
                  required_actions = set(required_display)
                  iam = boto3.client("iam")
                  try:
                      role = iam.get_role(RoleName=ROLE)["Role"]
                  except iam.exceptions.NoSuchEntityException:
                      send(event, "FAILED",
                           f"role {ROLE} does not exist in this account - "
                           "redeploy with the role-creation option set to 'create'")
                      return
                  problems, assume_ok, tag_ok = [], False, False
                  eid_problems, tag_problems = [], []
                  stmts = role["AssumeRolePolicyDocument"].get("Statement", [])
                  if isinstance(stmts, dict):
                      stmts = [stmts]
                  for st in stmts:
                      if not isinstance(st, dict) or st.get("Effect") != "Allow":
                          problems.append(f"unexpected non-Allow or malformed trust statement: {json.dumps(st)[:300]}")
                          continue
                      principals = statement_principals(st)
                      if principals is None:
                          problems.append(
                              "unrecognized trust statement shape (Principal is not an "
                              f"AWS account/role): {json.dumps(st)[:300]}")
                          continue
                      acts = st.get("Action", [])
                      acts = acts if isinstance(acts, list) else [acts]
                      unexpected_principals = [p for p in principals if p not in TRUSTED_PRINCIPALS]
                      if unexpected_principals:
                          problems.append(
                              "unexpected trust statement grants access to a principal "
                              "other than Surf AI: " + ", ".join(unexpected_principals))
                          continue
                      unexpected_actions = [a for a in acts if a not in TRUSTED_ACTIONS]
                      if unexpected_actions:
                          problems.append(
                              "unexpected action(s) granted to Surf AI beyond "
                              "sts:AssumeRole/sts:TagSession: " + ", ".join(unexpected_actions))
                      trusted = bool(principals) and not unexpected_principals
                      if trusted and "sts:AssumeRole" in acts:
                          eid = st.get("Condition", {}).get("StringEquals", {}).get("sts:ExternalId")
                          if eid == expected_eid:
                              assume_ok = True
                          elif eid is None:
                              eid_problems.append("the sts:AssumeRole statement has no sts:ExternalId condition")
                          else:
                              eid_problems.append("the External ID in the trust policy does not match the one provided")
                      if trusted and "sts:TagSession" in acts:
                          cond = st.get("Condition", {}) or {}
                          if any("sts:ExternalId" in (ops or {}) for ops in cond.values()):
                              tag_problems.append(
                                  "the sts:TagSession statement has an sts:ExternalId condition - "
                                  "sts:TagSession does not support that key, so the condition never "
                                  "matches and Surf AI's tagged AssumeRole calls are denied")
                          else:
                              tag_ok = True
                  if not assume_ok:
                      problems.extend(eid_problems or
                          ["trust policy does not allow sts:AssumeRole for Surf AI"])
                  if not tag_ok:
                      problems.extend(tag_problems or
                          ["trust policy does not allow sts:TagSession for Surf AI"])
                  required_managed = event["ResourceProperties"]["RequiredManagedPolicyArns"]
                  required_managed = set(required_managed if isinstance(required_managed, list) else [required_managed])
                  attached = []
                  for page in iam.get_paginator("list_attached_role_policies").paginate(RoleName=ROLE):
                      attached.extend(page["AttachedPolicies"])
                  attached_arns = {p["PolicyArn"] for p in attached}
                  missing_managed = required_managed - attached_arns
                  if missing_managed:
                      problems.append("missing required managed polic" +
                          ("y" if len(missing_managed) == 1 else "ies") + ": " +
                          ", ".join(sorted(missing_managed)))
                  extra = [p for p in attached if p["PolicyArn"] not in required_managed]
                  if extra:
                      extra_desc = sorted(f'{p["PolicyName"]} ({p["PolicyArn"]})' for p in extra)
                      print(f"role {ROLE} has unexpected extra managed policies: {extra_desc}")
                      problems.append("unexpected extra managed polic" +
                          ("y" if len(extra) == 1 else "ies") + " attached: " +
                          ", ".join(extra_desc) + " - detach these and redeploy")
                  if role.get("PermissionsBoundary"):
                      problems.append("role has a permissions boundary attached, which can silently remove access "
                          "Surf AI needs - remove it, or let this stack create the role instead")
                  granted, unbounded = set(), False
                  inline_paginator = iam.get_paginator("list_role_policies")
                  for page in inline_paginator.paginate(RoleName=ROLE):
                      for inline_name in page["PolicyNames"]:
                          acts = granted_actions(
                              iam.get_role_policy(RoleName=ROLE, PolicyName=inline_name)["PolicyDocument"],
                              f"inline policy {inline_name}", problems)
                          if acts is None:
                              unbounded = True
                          else:
                              granted |= acts
                  if not unbounded:
                      missing_actions = sorted(required_display[a] for a in required_actions - granted)
                      if missing_actions:
                          print(f"role {ROLE} is missing required actions: {missing_actions}")
                          problems.append("role does not grant the read-only actions Surf AI requires: " +
                              ", ".join(missing_actions))
                      extra_actions = sorted(granted - required_actions)
                      if extra_actions:
                          print(f"role {ROLE} grants actions beyond what Surf AI requires: {extra_actions}")
                          problems.append("role grants action" + ("" if len(extra_actions) == 1 else "s") +
                              " beyond what Surf AI requires: " + ", ".join(extra_actions) +
                              " - Surf AI's role must grant exactly the documented actions and nothing else")
                  if problems:
                      send(event, "FAILED", f"existing role {ROLE} is not valid: " + "; ".join(problems))
                  else:
                      send(event, "SUCCESS", f"existing role {ROLE} is correctly configured for Surf AI")
              except ResponseDeliveryError:
                  # Already retried in send() - re-raise, don't report as FAILED validation.
                  raise
              except Exception as e:
                  send(event, "FAILED", str(e))
      Tags:
        - Key: ManagedBy
          Value: surfai-integration

  ExistingRoleValidation:
    Type: Custom::ExistingRoleValidation
    Condition: UseExistingRole
    Properties:
      ServiceToken: !GetAtt ExistingRoleValidationFunction.Arn
      ExternalId: !Ref ExternalId
      RequiredManagedPolicyArns:
        - "arn:aws:iam::aws:policy/SecurityAudit"
      RequiredPolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailReadOnly
            Effect: Allow
            Action: "cloudtrail:LookupEvents"
            Resource: "*"
          - Sid: CloudWatchMetricsReadOnly
            Effect: Allow
            Action:
              - "cloudwatch:GetMetricData"
              - "cloudwatch:ListMetrics"
            Resource: "*"
          - Sid: EC2ReadOnly
            Effect: Allow
            Action:
              - "ec2:DescribeInstances"
              - "ec2:DescribeClientVpnEndpoints"
            Resource: "*"
          - Sid: IAMReadOnly
            Effect: Allow
            Action:
              - "iam:ListGroups"
              - "iam:ListPolicies"
              - "iam:GetPolicy"
              - "iam:ListAttachedRolePolicies"
              - "iam:ListRoles"
              - "iam:ListUsers"
            Resource: "*"
          - Sid: ACMReadOnly
            Effect: Allow
            Action:
              - "acm:ListCertificates"
              - "acm:DescribeCertificate"
              - "acm:ListTagsForCertificate"
            Resource: "*"
          - Sid: RDSReadOnly
            Effect: Allow
            Action: "rds:DescribeDBInstances"
            Resource: "*"
          - Sid: S3ReadOnly
            Effect: Allow
            Action: "s3:ListAllMyBuckets"
            Resource: "*"
          - Sid: ResourceGroupsTaggingReadOnly
            Effect: Allow
            Action: "tag:GetResources"
            Resource: "*"
          - Sid: ResourceGroupsReadOnly
            Effect: Allow
            Action: "resource-groups:ListGroups"
            Resource: "*"
          - Sid: IdentityStoreReadOnly
            Effect: Allow
            Action:
              - "identitystore:ListGroups"
              - "identitystore:ListGroupMemberships"
              - "identitystore:ListUsers"
            Resource: "*"
          - Sid: SSOAdminReadOnly
            Effect: Allow
            Action: "sso:ListInstances"
            Resource: "*"
          - Sid: OrganizationsReadOnly
            Effect: Allow
            Action:
              - "organizations:ListAccounts"
              - "organizations:DescribeOrganization"
            Resource: "*"

  S3RequestMetricsFunctionRole:
    Type: AWS::IAM::Role
    Condition: S3RequestMetricsEnabled
    Properties:
      Description: Execution role for the Lambda that enables S3 request metrics.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: EnableS3RequestMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:ListAllMyBuckets"
                  - "s3:GetBucketLocation"
                  - "s3:GetMetricsConfiguration"
                  - "s3:PutMetricsConfiguration"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"
      Tags:
        - Key: ManagedBy
          Value: surfai-integration

  S3RequestMetricsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: S3RequestMetricsEnabled
    Properties:
      LogGroupName: !Sub "/surfai/integration/${AWS::StackName}-s3-metrics"
      RetentionInDays: 30

  S3RequestMetricsFunction:
    Type: AWS::Lambda::Function
    Condition: S3RequestMetricsEnabled
    Properties:
      Description: Enables the EntireBucket S3 request-metrics filter on buckets that lack one.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt S3RequestMetricsFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref S3RequestMetricsLogGroup
      Code:
        ZipFile: |
          import boto3, json, time, urllib.request

          class ResponseDeliveryError(Exception):
              """Delivery failure, not a sweep result - must not be caught as generic Exception."""

          def send(event, status, reason):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason[:3800],
                  "PhysicalResourceId": "surfai-s3-request-metrics",
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }).encode()
              last_error = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          event["ResponseURL"], data=body, method="PUT",
                          headers={"Content-Type": ""})
                      urllib.request.urlopen(req, timeout=3)
                      return
                  except Exception as e:
                      last_error = e
                      if attempt < 2:
                          time.sleep(2 ** attempt)
              # Distinguishable type - see the validator Lambda for why.
              print(f"failed to deliver CloudFormation response after 3 attempts: {last_error}")
              raise ResponseDeliveryError(last_error)

          def sweep(context, daily_sweep_scheduled):
              s3 = boto3.client("s3")
              # Paginated: AWS rejects unpaginated calls above the 10,000-bucket quota.
              names = [b["Name"] for page in s3.get_paginator("list_buckets").paginate()
                       for b in page["Buckets"]]
              ok, skipped, failed = 0, 0, []
              regional_clients = {}
              truncated = False
              for name in names:
                  # Reserve time to send the response before the Lambda's own timeout hits.
                  if context.get_remaining_time_in_millis() < 20000:
                      truncated = True
                      break
                  try:
                      loc = s3.get_bucket_location(Bucket=name).get("LocationConstraint")
                      region = {"EU": "eu-west-1", None: "us-east-1"}.get(loc, loc)
                      rs3 = regional_clients.get(region)
                      if rs3 is None:
                          rs3 = regional_clients[region] = boto3.client("s3", region_name=region)
                      try:
                          rs3.get_bucket_metrics_configuration(Bucket=name, Id="EntireBucket")
                          skipped += 1
                          continue
                      except rs3.exceptions.ClientError as e:
                          if e.response["Error"]["Code"] != "NoSuchConfiguration":
                              raise
                      rs3.put_bucket_metrics_configuration(
                          Bucket=name, Id="EntireBucket",
                          MetricsConfiguration={"Id": "EntireBucket"})
                      ok += 1
                  except Exception as e:
                      failed.append(f"{name}: {e}")
              reason = (f"Enabled EntireBucket request metrics on {ok} bucket(s), "
                        f"{skipped} already had it, of {len(names)} total")
              if truncated:
                  remaining = len(names) - ok - skipped - len(failed)
                  reason += (f"; stopped early to leave time to respond, "
                             f"{remaining} bucket(s) not yet checked this run")
                  reason += (" - the daily sweep will cover them" if daily_sweep_scheduled
                             else " - re-deploy or update this stack to continue, "
                                  "no daily sweep is scheduled to pick them up")
              if failed:
                  reason += "; FAILED: " + "; ".join(failed)
              print(reason)
              return reason, failed

          def handler(event, context):
              is_cfn = "ResponseURL" in event
              if is_cfn and event["RequestType"] == "Delete":
                  send(event, "SUCCESS",
                       "Delete is a no-op; request-metrics filters are left in place")
                  return
              # EventBridge invocation has no ResourceProperties; being invoked at all implies scheduled.
              daily_sweep_scheduled = event.get("ResourceProperties", {}).get(
                  "DailySweepScheduled", "true") == "true"
              try:
                  reason, failed = sweep(context, daily_sweep_scheduled)
                  if is_cfn:
                      # Per-bucket failures don't fail the resource - that would delete the role over one bad bucket.
                      send(event, "SUCCESS", reason)
              except ResponseDeliveryError:
                  # Already retried in send() - re-raise, don't report the sweep as FAILED.
                  raise
              except Exception as e:
                  if is_cfn:
                      send(event, "FAILED", str(e))
                  else:
                      raise
      Tags:
        - Key: ManagedBy
          Value: surfai-integration

  S3RequestMetricsSetup:
    Type: Custom::S3RequestMetrics
    Condition: S3RequestMetricsEnabled
    Properties:
      ServiceToken: !GetAtt S3RequestMetricsFunction.Arn
      # Only affects the wording of a truncation message, not whether the sweep runs.
      DailySweepScheduled: !Ref AutoEnableNewBuckets

  S3RequestMetricsDailySweep:
    Type: AWS::Events::Rule
    Condition: DailySweepEnabled
    Properties:
      Description: Daily check that enables S3 request metrics on newly created buckets.
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt S3RequestMetricsFunction.Arn
          Id: surfai-s3-metrics-sweep

  S3RequestMetricsSweepPermission:
    Type: AWS::Lambda::Permission
    Condition: DailySweepEnabled
    Properties:
      FunctionName: !Ref S3RequestMetricsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3RequestMetricsDailySweep.Arn

Outputs:
  RoleArn:
    Description: ARN of the role. Provide this to your Surf AI representative.
    Value: !If
      - UseExistingRole
      - !Sub "arn:aws:iam::${AWS::AccountId}:role/surfai-integration-role"
      - !GetAtt SurfAiIntegrationRole.Arn
  AccountRegion:
    Description: Region of this stack. Provide this to your Surf AI representative.
    Value: !Ref AWS::Region
  S3RequestMetricsEnabled:
    Description: Whether S3 request metrics were enabled by this stack.
    Value: !Ref EnableS3RequestMetrics
